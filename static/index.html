<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stockwiz — Sign In</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-card">
      <header class="auth-brand">
        <div class="auth-logo">S</div>
        <div>
          <h1>Stockwiz</h1>
          <p class="auth-tagline">Basket trading · Folio subscriptions</p>
        </div>
      </header>

      <form id="loginForm" class="auth-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email"
               required placeholder="you@example.com" />

        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password"
                 autocomplete="current-password" required placeholder="••••••••" />
          <button type="button" id="togglePassword" class="ghost-btn"
                  aria-label="Show password">Show</button>
        </div>

        <div id="errorBox" class="auth-error" hidden></div>

        <button type="submit" id="loginBtn" class="primary-btn">
          <span class="btn-label">Sign in</span>
          <span class="btn-spinner" hidden></span>
        </button>

        <p class="auth-foot">
          Don't have an account?
          <a href="/register">Create one</a>
        </p>
      </form>
    </section>

    <footer class="auth-copy">
      &copy; <span id="year"></span> Stockwiz. All rights reserved.
    </footer>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
