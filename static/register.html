<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stockwiz — Create Account</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-card">
      <header class="auth-brand">
        <div class="auth-logo">S</div>
        <div>
          <h1>Create your account</h1>
          <p class="auth-tagline">Join Stockwiz to subscribe to Folios</p>
        </div>
      </header>

      <form id="registerForm" class="auth-form" novalidate>
        <label for="fullName">Full name <span class="opt">(optional)</span></label>
        <input id="fullName" name="fullName" type="text"
               autocomplete="name" maxlength="120" placeholder="Jane Doe" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email"
               required placeholder="you@example.com" />

        <label for="password">Password <span class="opt">(min 8 chars)</span></label>
        <div class="password-wrap">
          <input id="password" name="password" type="password"
                 autocomplete="new-password" required minlength="8"
                 placeholder="••••••••" />
          <button type="button" id="togglePassword" class="ghost-btn"
                  aria-label="Show password">Show</button>
        </div>

        <div id="errorBox" class="auth-error" hidden></div>

        <button type="submit" id="registerBtn" class="primary-btn">
          <span class="btn-label">Create account</span>
          <span class="btn-spinner" hidden></span>
        </button>

        <p class="auth-foot">
          Already have an account?
          <a href="/">Sign in</a>
        </p>
      </form>
    </section>

    <footer class="auth-copy">
      &copy; <span id="year"></span> Stockwiz. All rights reserved.
    </footer>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
